version: "3.8"

services:
  garagemind-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garagemind-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: garagemind-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Europe/Berlin
      # From inside the n8n container, reach the API via the service name:
      - GARAGEMIND_API_URL=http://garagemind-api:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/imports:ro
    depends_on:
      - garagemind-api
    restart: unless-stopped

volumes:
  n8n_data:
